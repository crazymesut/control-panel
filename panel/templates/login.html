<!DOCTYPE html>
<html lang="tr" class="h-full bg-gray-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş — VPS Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center bg-gray-950 text-gray-100">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="text-4xl mb-3">⚡</div>
      <h1 class="text-2xl font-bold text-white">VPS Panel</h1>
      <p class="text-gray-500 text-sm mt-1">Yönetim Paneli</p>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-7 shadow-2xl">
      {% if error %}
      <div class="mb-5 px-4 py-3 bg-red-900/40 border border-red-700/50 rounded-lg text-sm text-red-300">
        ⚠ {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Kullanıcı Adı</label>
          <input name="username" type="text" required autofocus
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white
                   placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="admin">
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-400 mb-1.5">Şifre</label>
          <input name="password" type="password" required
            class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-white
                   placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
            placeholder="••••••••">
        </div>
        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition-colors mt-2">
          Giriş Yap →
        </button>
      </form>
    </div>
    <p class="text-center text-gray-700 text-xs mt-5">VPS Panel v1.0</p>
  </div>
</body>
</html>
